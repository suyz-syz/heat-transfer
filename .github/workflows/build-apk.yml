name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            python3-dev \
            autoconf automake libtool libltdl-dev pkg-config \
            cmake lld \
            gettext \
            libffi-dev libssl-dev zlib1g-dev \
            libsqlite3-dev libgdbm-dev \
            libncurses-dev libreadline-dev tk8.6-dev \
            libbz2-dev liblzma-dev \
            libgl1-mesa-dev \
            zip unzip \
            openjdk-17-jdk

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      - name: Cache Buildozer SDK/NDK (~/.buildozer)
        uses: actions/cache@v6
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-global-${{ hashFiles('buildozer.spec') }}

      - name: Cache local .buildozer
        uses: actions/cache@v6
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-local-${{ hashFiles('buildozer.spec') }}

      - name: Reuse preinstalled Android NDK r27c (skip 1GB download)
        run: |
          # GitHub ubuntu 镜像预装 NDK 27.3.13750724（= r27c，与 spec 中 android.ndk=27c 对应）
          NDK_DIR="$(ls -d /usr/local/lib/android/sdk/ndk/27.3.* 2>/dev/null | head -n1)"
          if [ -z "$NDK_DIR" ]; then
            echo "未找到预装 NDK r27c，buildozer 将按 android.ndk=27c 自行下载"
            exit 0
          fi
          DEST="$HOME/.buildozer/android/platform/android-ndk-r27c"
          mkdir -p "$HOME/.buildozer/android/platform"
          if [ ! -d "$DEST" ] || [ -L "$DEST" ]; then
            ln -sfn "$NDK_DIR" "$DEST"
            echo "已将预装 NDK 链接到 $DEST"
          else
            echo "android-ndk-r27c 已存在（缓存），跳过链接"
          fi

      - name: Build debug APK
        run: |
          # 构建失败时自动提取关键错误行打印到日志末尾，避免真实报错被淹没在长日志中
          buildozer -v android debug 2>&1 | tee /tmp/buildozer.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo ""
            echo "===== 关键错误行（自动提取） ====="
            grep -nE "Traceback|\[ERROR\]|ERROR:|Error:|FAILED|Caused by|Exception|error:|No such|not found" /tmp/buildozer.log | tail -60 || true
            echo "==================================="
            exit "$status"
          fi

      - name: Build release APK (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: buildozer -v android release

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: kilnheat-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          generate_release_notes: true
