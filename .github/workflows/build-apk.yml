name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            python3-dev \
            autoconf automake libtool pkg-config \
            cmake lld \
            gettext \
            libffi-dev libssl-dev zlib1g-dev \
            libsqlite3-dev libgdbm-dev \
            libncurses5-dev libreadline-dev libtk8.6-dev \
            libbz2-dev liblzma-dev \
            libgl1-mesa-dev \
            zip unzip \
            openjdk-17-jdk \
            gdm3

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      - name: Cache Buildozer SDK/NDK (~/.buildozer)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-global-${{ hashFiles('buildozer.spec') }}

      - name: Cache local .buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-local-${{ hashFiles('buildozer.spec') }}

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Build release APK (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: buildozer -v android release

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kilnheat-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          generate_release_notes: true
