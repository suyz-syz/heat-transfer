name: Docker Publish

on:
  push:
    branches: [main, master, feat/phase-1c-gui-docker-apk, feat/phase-1c-p0-semantics-diagnostics]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=20260826,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=p0-${{ github.sha }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build local Docker image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: kiln-p0-smoke:local
          cache-from: type=gha
      - name: Docker API and Web UI smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -d --name kiln-p0-smoke -p 8000:8000 -p 8501:8501 kiln-p0-smoke:local
          cleanup() { docker rm -f kiln-p0-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null \\
              && curl --fail --silent http://127.0.0.1:8501/ >/dev/null; then
              echo "API health and Streamlit Web UI are reachable."
              exit 0
            fi
            sleep 2
          done
          docker logs kiln-p0-smoke
          echo "Container API/Web smoke test timed out." >&2
          exit 1
