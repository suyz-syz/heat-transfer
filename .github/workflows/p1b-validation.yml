name: P1b Python and schema validation

on:
  push:
    branches:
      - feat/phase-1c-p1a-radiation-absorption
  pull_request:
    branches:
      - feat/phase-1c-p1a-radiation-absorption

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install headless UI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt scipy
      - name: Run pytest, schema, and UI regression suite
        run: xvfb-run -a python -m pytest tests/ -v
