name: Kiln HT Tests

on:
  push:
    branches:
      - 'fix/kiln-heat-transfer-audit'
      - 'feat/phase-1b-hitemp-wsgg'
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest tests/test_calc.py tests/test_gas_radiation.py tests/test_materials.py tests/test_phase1b_wsgg.py tests/test_phase2_architecture.py -q
      - name: Generate built-in WSGG surrogate report
        run: >-
          python scripts/benchmark_literature_emissivity.py
          --builtin
          --output reports/literature_wsgg_R1.json
          --wall-temperature-k 800
      - name: Upload built-in benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: builtin-wsgg-report
          path: reports/literature_wsgg_R1.json
          if-no-files-found: error
