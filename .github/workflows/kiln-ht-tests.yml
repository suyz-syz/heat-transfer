name: Kiln HT Tests

on:
  push:
    branches:
      - 'fix/kiln-heat-transfer-audit'
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest tests/test_calc.py -q
